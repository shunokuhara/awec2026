<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動画評価実験 — ログイン</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="login">
  <div class="card">
    <h2>動画評価実験 ログイン</h2>
    <div id="msg" class="msg"></div>
    <label>メールアドレス</label><input id="email" type="email" autocomplete="username">
    <label>パスワード</label><input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button id="go" style="width:100%">ログイン</button></div>
    <p class="mut" style="margin-top:14px">パスワードは管理者から個別に配布されます。共有せずに使用してください。</p>
  </div>
</main>
<script>
const $=(s)=>document.querySelector(s);
function show(t,k){const m=$('#msg');m.textContent=t;m.className='msg '+k;}
async function login(){
  $('#go').disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({email:$('#email').value,password:$('#pw').value})});
    const d=await r.json();
    if(!r.ok){show(d.error==='invalid'?'メールアドレスまたはパスワードが違います':'エラー: '+d.error,'err');$('#go').disabled=false;return;}
    location.href = d.role==='admin' ? '/admin/' : '/evaluate/';
  }catch(e){show('通信エラー','err');$('#go').disabled=false;}
}
$('#go').addEventListener('click',login);
document.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script></body></html>
