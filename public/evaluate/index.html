<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動画評価 — 動画評価実験</title><link rel="stylesheet" href="/styles.css"></head><body>
<header>
  <h1>動画評価</h1>
  <span id="prog" class="mut"></span>
  <div class="bar" style="width:160px"><i id="progbar" style="width:0%"></i></div>
  <span class="sp"></span>
  <span id="who" class="mut"></span>
  <button class="sec" id="logout">ログアウト</button>
</header>
<main>
  <div id="msg" class="msg"></div>
  <div id="view"></div>
</main>
<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=(t,k)=>{const m=$('#msg');m.textContent=t;m.className='msg '+k;setTimeout(()=>{m.className='msg'},4000);};
async function api(p,o){const r=await fetch(p,o);if(r.status===401){location.href='/';return null;}
  const d=await r.json().catch(()=>({}));if(!r.ok){show('エラー: '+(d.error||r.status),'err');return null;}return d;}

let ITEMS=null,PRE=null,LAYER={},STATE=null,shownAt=0;

async function boot(){
  const me=await api('/api/me'); if(!me)return;
  $('#who').textContent=me.name||me.email;
  const it=await api('/api/items'); if(!it)return;
  ITEMS=it.items;PRE=it.pre;LAYER=it.layer_label;
  await refresh();
}

async function refresh(){
  STATE=await api('/api/tasks'); if(!STATE)return;
  const done=STATE.tasks.filter(t=>t.done).length,n=STATE.tasks.length;
  $('#prog').textContent=`${done} / ${n}`;
  $('#progbar').style.width=(n?Math.round(100*done/n):0)+'%';
  if(!STATE.pre_done){renderPre();return;}
  const next=STATE.tasks.find(t=>!t.done);
  if(!next){renderDone();return;}
  // ブロックの切れ目に来たら自由再生を挟む
  const bs=STATE.block_size||25;
  if(next.position>0 && next.position%bs===0 && !sessionStorage.getItem('recall'+ (next.position/bs))){
    renderRecall(next.position/bs);return;
  }
  renderTask(next);
}

function renderPre(){
  const rows=PRE.map(q=>{
    if(q.type==='text')return `<div class="q"><div class="qh">${esc(q.name)}</div><input data-pre="${q.id}"></div>`;
    const opts=q.options.map((o,i)=>`<label class="opt"><input type="radio" name="${q.id}" value="${i}" data-pre="${q.id}">${esc(o)}</label>`).join('');
    return `<div class="q"><div class="qh">${esc(q.name)}</div>${opts}</div>`;
  }).join('');
  $('#view').innerHTML=`<div class="card"><h2>はじめに（1回だけ回答してください）</h2>
    <p class="mut">評価を始める前の状態を記録します。正解はありません。</p>${rows}
    <div style="margin-top:16px"><button id="pre_go">回答して評価を始める</button></div></div>`;
  $('#pre_go').addEventListener('click',async()=>{
    const payload={};
    for(const q of PRE){
      if(q.type==='text'){payload[q.id]=document.querySelector(`input[data-pre="${q.id}"]`).value;}
      else{const c=document.querySelector(`input[name="${q.id}"]:checked`);
        if(!c){show('未回答の項目があります','err');return;} payload[q.id]=Number(c.value);}
    }
    const d=await api('/api/survey',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({kind:'pre',block:0,payload})});
    if(d)refresh();
  });
}

function renderRecall(block){
  $('#view').innerHTML=`<div class="card"><h2>ここまでの区切りです</h2>
    <p class="mut">このセッションで見た動画のうち、内容を思い出せるものをできるだけ挙げてください。順不同で構いません。思い出せない場合は「なし」と記入してください。</p>
    <textarea id="rc" rows="8"></textarea>
    <div style="margin-top:14px"><button id="rc_go">送信して次のセッションへ</button></div></div>`;
  $('#rc_go').addEventListener('click',async()=>{
    const d=await api('/api/survey',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({kind:'recall',block,payload:{text:$('#rc').value}})});
    if(d){sessionStorage.setItem('recall'+block,'1');refresh();}
  });
}

function renderTask(t){
  const qs=ITEMS.map(it=>{
    const opts=it.options.map((o,i)=>
      `<label class="opt"><input type="radio" name="${it.id}" value="${i}">${esc(o)}</label>`).join('');
    return `<div class="q"><div class="qh">${esc(it.name)}<span class="badge">${esc(LAYER[it.layer]||'')}</span></div>${opts}</div>`;
  }).join('');
  const player=t.embed_url
    ? `<div class="videobox"><iframe src="${esc(t.embed_url)}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`
    : `<p class="mut">この動画は埋め込みで再生できません。次のリンクを別タブで開いて視聴してください。</p>
       <p><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.url)}</a></p>`;
  $('#view').innerHTML=`<div class="card">
      <h2>${t.position+1}本目</h2>${player}
      <p class="mut" style="margin-top:8px">動画のタイトルや制作者は表示していません。映像だけを見て回答してください。</p>
    </div>
    <div class="card">${qs}
      <div style="margin-top:18px;display:flex;gap:10px;align-items:center">
        <button id="submit">回答して次へ</button>
        <span class="mut" id="hint"></span>
      </div>
    </div>`;
  shownAt=Date.now();
  document.querySelectorAll('.opt input').forEach(r=>r.addEventListener('change',()=>{
    document.querySelectorAll(`input[name="${r.name}"]`).forEach(x=>x.closest('.opt').classList.toggle('on',x.checked));
  }));
  $('#submit').addEventListener('click',async()=>{
    const body={position:t.position,elapsed_ms:Date.now()-shownAt};
    for(const it of ITEMS){
      const c=document.querySelector(`input[name="${it.id}"]:checked`);
      if(!c){$('#hint').textContent='未回答の項目があります';return;}
      body[it.id]=Number(c.value);
    }
    $('#submit').disabled=true;
    const d=await api('/api/response',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    if(d){window.scrollTo(0,0);refresh();}else{$('#submit').disabled=false;}
  });
  window.scrollTo(0,0);
}

function renderDone(){
  $('#view').innerHTML=`<div class="card"><h2>すべての動画の評価が終わりました</h2>
    <p class="mut">ご協力ありがとうございました。この画面は閉じて構いません。</p></div>`;
}

$('#logout').addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.href='/';});
boot();
</script></body></html>
