<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>初期セットアップ — 動画評価実験</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="login">
  <div class="card">
    <h2>初期セットアップ</h2>
    <div id="msg" class="msg"></div>
    <div id="form">
      <p class="mut">最初の管理者を1人だけ作ります。作成後、この画面は使えなくなります。</p>
      <label>メールアドレス</label><input id="email" type="email">
      <label>氏名</label><input id="name" placeholder="管理者">
      <label>パスワード（8文字以上）</label><input id="pw" type="password">
      <label>パスワード（確認）</label><input id="pw2" type="password">
      <div style="margin-top:14px"><button id="go" style="width:100%">管理者を作成</button></div>
    </div>
  </div>
</main>
<script>
const $=(s)=>document.querySelector(s);
const show=(t,k)=>{const m=$('#msg');m.textContent=t;m.className='msg '+k;};
fetch('/api/bootstrap/status').then(r=>r.json()).then(d=>{
  if(d.initialized){$('#form').style.display='none';
    show('すでに管理者が登録されています。ログイン画面からお進みください。','err');}
});
$('#go').addEventListener('click',async()=>{
  if($('#pw').value!==$('#pw2').value){show('パスワードが一致しません','err');return;}
  $('#go').disabled=true;
  const r=await fetch('/api/bootstrap',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({email:$('#email').value,name:$('#name').value,password:$('#pw').value})});
  const d=await r.json();
  if(!r.ok){show('エラー: '+d.error,'err');$('#go').disabled=false;return;}
  $('#form').style.display='none';
  show('管理者を作成しました。ログイン画面へ移動します。','ok');
  setTimeout(()=>location.href='/',1500);
});
</script></body></html>
