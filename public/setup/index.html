<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>初期化 — 動画評価実験</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="login">
  <div class="card">
    <h2>初期化</h2>
    <div id="msg" class="msg"></div>
    <div id="form">
      <p class="mut">D1 にテーブルを作り、管理者1名・評価者8名・動画96本を投入します。1回だけ実行できます。</p>
      <label>BOOTSTRAP_TOKEN</label><input id="tok" type="password" autocomplete="off">
      <p class="mut">Cloudflare ダッシュボードの Settings → Variables and Secrets で設定した値です。</p>
      <div style="margin-top:14px"><button id="go" style="width:100%">初期化する</button></div>
    </div>
  </div>
</main>
<script>
const $=(s)=>document.querySelector(s);
const show=(t,k)=>{const m=$('#msg');m.textContent=t;m.className='msg '+k;};
fetch('/api/bootstrap/status').then(r=>r.json()).then(d=>{
  if(d.initialized){$('#form').style.display='none';
    show('初期化は完了しています。ログイン画面からお進みください。','ok');}
  else if(!d.ready){show('BOOTSTRAP_TOKEN が未設定です。ダッシュボードで設定してください。','err');}
}).catch(()=>show('APIに接続できません。D1 バインディング DB を確認してください。','err'));
$('#go').addEventListener('click',async()=>{
  $('#go').disabled=true;
  const r=await fetch('/api/bootstrap',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({token:$('#tok').value})});
  const d=await r.json();
  if(!r.ok){show('エラー: '+d.error,'err');$('#go').disabled=false;return;}
  $('#form').style.display='none';
  show(`初期化しました（評価者 ${d.raters} 名 / 動画 ${d.videos} 本）。ログイン画面へ移動します。`,'ok');
  setTimeout(()=>location.href='/',2000);
});
</script></body></html>
